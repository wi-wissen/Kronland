name: Tests

# Cheap checks (Vitest + build, a few minutes) on every push to a pull request.
# The slow browser tests (Playwright, desktop + phone) only once a pull request is ready for review
# (not as a draft), on demand via "Run workflow" and nightly on main; on main the Pages build checks the build.
# A ready pull request skips them when it only touches documentation or Vitest tests, or carries the label
# "skip-e2e" (small fixes whose affected specs ran locally, rules in docs/TESTS.md).
# Browser tests run in parallel jobs: one build job shares dist/ (artifact), the light specs are split into
# shards, the heavy specs (high graphics level, showcase) form their own shards, a final job merges the
# reports. Organisation: docs/TESTS.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
  # Full browser suite on main every night: catches what a skipped pull request let through
  schedule:
    - cron: '0 3 * * *'

# A new push cancels the run of the previous one on the same pull request
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Decide whether the browser tests run: always on "Run workflow" and at night, for a ready pull request unless
  # it only touches documentation or Vitest tests or carries the label "skip-e2e"
  e2e-plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-e2e') }}
        run: |
          run=true; why='full suite'
          if [ "$EVENT" = pull_request ]; then
            # the checkout is the merge commit: its first parent is the base branch
            other=$(git diff --name-only HEAD^1 HEAD | grep -Ev '^(README\.md|CLAUDE\.md|docs/[^/]+\.md|tests/.*|\.claude/.*)$' || true)
            if [ "$SKIP_LABEL" = true ]; then run=false; why='label skip-e2e'
            elif [ -z "$other" ]; then run=false; why='only documentation or Vitest tests changed'
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Browser tests: $run ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  # Build once for all browser test shards (parallel to the unit job, so the shards do not wait for Vitest)
  build:
    needs: e2e-plan
    if: needs.e2e-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: light, shard: 1/12, id: light-1 }
          - { group: light, shard: 2/12, id: light-2 }
          - { group: light, shard: 3/12, id: light-3 }
          - { group: light, shard: 4/12, id: light-4 }
          - { group: light, shard: 5/12, id: light-5 }
          - { group: light, shard: 6/12, id: light-6 }
          - { group: light, shard: 7/12, id: light-7 }
          - { group: light, shard: 8/12, id: light-8 }
          - { group: light, shard: 9/12, id: light-9 }
          - { group: light, shard: 10/12, id: light-10 }
          - { group: light, shard: 11/12, id: light-11 }
          - { group: light, shard: 12/12, id: light-12 }
          - { group: heavy, shard: 1/3, id: heavy-1 }
          - { group: heavy, shard: 2/3, id: heavy-2 }
          - { group: heavy, shard: 3/3, id: heavy-3 }
    name: e2e ${{ matrix.group }} ${{ matrix.shard }}
    # Playwright image: browser and system libraries preinstalled (installing them with apt took up to 10 min).
    # The tag must match @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      E2E_GROUP: ${{ matrix.group }}
      E2E_PREBUILT: '1'
      # distinct blob names, the merge job collects them into one folder
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.id }}.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx playwright test --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.id }}
          path: blob-report/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.id }}
          path: test-results/
          retention-days: 7

  # One HTML report for all shards (also when some failed)
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html,github ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
