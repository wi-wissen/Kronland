name: Pages

# Every push to main publishes the website (game, manual, compendium, blog) on GitHub Pages under
# https://kronland.wi7.net/ – no releases, always the current state of main (docs/WEBSITE.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest push is deployed; a running deployment is finished, not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Server and sources come from the repository variables (Settings > Variables), not from Git; unset = stage 0
      - run: node scripts/write-config.mjs
        env:
          KRONLAND_SERVER: ${{ vars.KRONLAND_SERVER }}
          KRONLAND_SOURCES: ${{ vars.KRONLAND_SOURCES }}
      - run: npm run build
        env:
          KRONLAND_SITE_URL: https://kronland.wi7.net/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
