name: Pages

# Every push to main publishes the website (game, manual, compendium, blog) on GitHub Pages under
# https://kronland.wi7.net/ – no releases, always the current state of main (docs/WEBSITE.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest push is deployed; a running deployment is finished, not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Server and sources come from the repository variables (Settings > Variables), not from Git; unset = stage 0
      - name: Write kronland.config.json
        env:
          KRONLAND_SERVER: ${{ vars.KRONLAND_SERVER }}
          KRONLAND_SOURCES: ${{ vars.KRONLAND_SOURCES }}
        run: |
          node -e '
            const e = process.env;
            const server = (e.KRONLAND_SERVER || "").trim().replace(/\/+$/, "");
            const sources = [...new Set((e.KRONLAND_SOURCES || "").split(/[\s,]+/).filter(Boolean))];
            if (!server && !sources.length) process.exit(0);
            for (const u of [server, ...sources].filter(Boolean)) if (!/^https?:\/\/\S+$/.test(u)) throw new Error("not an http(s) address: " + u);
            const doc = { format: "kronland-config", version: 1, ...(server && { server }), sources };
            require("fs").writeFileSync("public/kronland.config.json", JSON.stringify(doc, null, 2) + "\n");
          '
      - run: npm run build
        env:
          KRONLAND_SITE_URL: https://kronland.wi7.net/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
