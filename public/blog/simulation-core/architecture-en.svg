<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 520" width="1070" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#3b2a14">
<title>Commands in, state out</title>
<rect width="1070" height="520" fill="#fffaf0"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7a4a"/></marker></defs><rect x="20" y="20" width="200" height="62" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="120" y="46.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Human</text><text x="120" y="65.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">mouse, touch, keyboard</text><path d="M222,51 L286,172" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="98" width="200" height="62" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="120" y="124.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">AI opponent</text><text x="120" y="143.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">src/ai</text><path d="M222,129 L286,172" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="176" width="200" height="62" rx="8" fill="#f3efe6" stroke="#9b7a4a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="120" y="202.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Network player</text><text x="120" y="221.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">later: lockstep</text><path d="M222,207 L286,172" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="6 4"/><rect x="20" y="254" width="200" height="62" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="120" y="280.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Tests and bots</text><text x="120" y="299.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">Vitest, scripts</text><path d="M222,285 L286,172" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><rect x="290" y="140" width="210" height="66" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="395" y="168.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Commands</text><text x="395" y="187.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">{ type: "placeBuilding", … }</text><path d="M502,173 L556,173" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><rect x="560" y="100" width="250" height="150" rx="8" fill="#cfe0f2" stroke="#3a6ea5" stroke-width="2.5"/><text x="685" y="135" text-anchor="middle" font-size="18" font-weight="700">Simulation</text><text x="685" y="158" text-anchor="middle" font-size="13.5" fill="#7a6a50">src/sim · 10 ticks per second</text><text x="685" y="200" text-anchor="middle" font-size="13.5">integers only · seeded randomness</text><text x="685" y="222" text-anchor="middle" font-size="13.5">no DOM, no Three.js</text><path d="M685,252 L685,290" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><rect x="560" y="294" width="250" height="62" rx="8" fill="#d8ead0" stroke="#4f8a3c" stroke-width="1.5"/><text x="685" y="320.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">State</text><text x="685" y="339.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">map, figures, buildings, stock</text><rect x="860" y="294" width="190" height="62" rx="8" fill="#e8e0d0" stroke="#9b7a4a" stroke-width="1.5"/><text x="955" y="320.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">State hash</text><text x="955" y="339.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">one number for everything</text><path d="M812,325 L856,325" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><rect x="470" y="410" width="190" height="62" rx="8" fill="#d8ead0" stroke="#4f8a3c" stroke-width="1.5"/><text x="565" y="436.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Rendering</text><text x="565" y="455.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">Three.js · read only</text><rect x="710" y="410" width="190" height="62" rx="8" fill="#d8ead0" stroke="#4f8a3c" stroke-width="1.5"/><text x="805" y="436.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Interface</text><text x="805" y="455.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">Vue · read only</text><path d="M640,358 L580,406" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/><path d="M730,358 L790,406" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="560" y="392" text-anchor="end" font-size="13" fill="#7a6a50" font-style="italic">read</text><text x="812" y="392" font-size="13" fill="#7a6a50" font-style="italic">read</text><text x="20" y="500" font-size="15" font-weight="700">The only way in: commands. The only way out: reading.</text>
</svg>
