<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 310" width="1090" height="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#3b2a14">
<title>Drawing one by one or instanced</title>
<rect width="1090" height="310" fill="#fffaf0"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7a4a"/></marker></defs><text x="20" y="30" font-size="16" font-weight="700">One by one: one draw call per figure</text><rect x="20" y="50" width="180" height="56" rx="8" fill="#cfe0f2" stroke="#3a6ea5" stroke-width="1.5"/><text x="110" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Processor (CPU)</text><rect x="330" y="50" width="180" height="56" rx="8" fill="#d8ead0" stroke="#4f8a3c" stroke-width="1.5"/><text x="420" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Graphics card (GPU)</text><path d="M202,60 L326,60" fill="none" stroke="#9b7a4a" stroke-width="1.5" marker-end="url(#ah)"/><path d="M202,68 L326,68" fill="none" stroke="#9b7a4a" stroke-width="1.5" marker-end="url(#ah)"/><path d="M202,76 L326,76" fill="none" stroke="#9b7a4a" stroke-width="1.5" marker-end="url(#ah)"/><path d="M202,84 L326,84" fill="none" stroke="#9b7a4a" stroke-width="1.5" marker-end="url(#ah)"/><path d="M202,92 L326,92" fill="none" stroke="#9b7a4a" stroke-width="1.5" marker-end="url(#ah)"/><path d="M202,100 L326,100" fill="none" stroke="#9b7a4a" stroke-width="1.5" marker-end="url(#ah)"/><text x="265" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b5402a">… 300 figures → 300 calls</text><text x="560" y="30" font-size="16" font-weight="700">Instanced: one draw call for all</text><rect x="560" y="50" width="180" height="56" rx="8" fill="#cfe0f2" stroke="#3a6ea5" stroke-width="1.5"/><text x="650" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Processor (CPU)</text><rect x="870" y="50" width="200" height="56" rx="8" fill="#d8ead0" stroke="#4f8a3c" stroke-width="1.5"/><text x="970" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Graphics card (GPU)</text><path d="M742,78 L866,78" fill="none" stroke="#9b7a4a" stroke-width="3" marker-end="url(#ah)"/><text x="804" y="64" text-anchor="middle" font-size="13">1 draw call</text><rect x="870" y="130" width="200" height="56" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="970" y="153.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Shape</text><text x="970" y="172.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">uploaded once</text><rect x="870" y="200" width="200" height="56" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="970" y="223.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Bone texture</text><text x="970" y="242.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">all poses of all motions</text><rect x="560" y="130" width="230" height="56" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="675" y="153.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">Table per figure</text><text x="675" y="172.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">matrix · animation frame · colour</text><path d="M792,158 L866,158" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="560" y="290" font-size="13.5" font-weight="700" fill="#4f8a3c">300 figures → 1 call per model and detail level</text>
</svg>
