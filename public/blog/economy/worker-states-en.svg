<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 460" width="1030" height="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#3b2a14">
<title>State machine of a worker</title>
<rect width="1030" height="460" fill="#fffaf0"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7a4a"/></marker></defs><rect x="380" y="150" width="230" height="70" rx="8" fill="#cfe0f2" stroke="#3a6ea5" stroke-width="2.5"/><text x="495" y="180.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">working</text><text x="495" y="199.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">one cycle costs 100 stamina</text><rect x="760" y="40" width="240" height="70" rx="8" fill="#d8ead0" stroke="#4f8a3c" stroke-width="1.5"/><text x="880" y="70.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">eating</text><text x="880" y="89.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">farm, otherwise campfire</text><rect x="760" y="260" width="240" height="70" rx="8" fill="#d8ead0" stroke="#4f8a3c" stroke-width="1.5"/><text x="880" y="290.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">sleeping</text><text x="880" y="309.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">residence, otherwise campfire</text><rect x="30" y="150" width="250" height="70" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="155" y="180.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">fetching</text><text x="155" y="199.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">refiners only: from store or mine</text><rect x="30" y="300" width="250" height="62" rx="8" fill="#e8e0d0" stroke="#9b7a4a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="155" y="326.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">waiting</text><text x="155" y="345.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">no place, no raw goods</text><path d="M612,165 L756,85" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><text x="690" y="150" font-size="13.5" font-weight="700" fill="#b5402a">stamina &lt; 100</text><path d="M880,112 L880,256" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><text x="892" y="190" font-size="13.5" fill="#7a6a50">fed</text><path d="M756,300 L612,210" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><text x="640" y="285" font-size="13.5" fill="#7a6a50">rested</text><path d="M378,175 L284,175" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><text x="296" y="165" font-size="13" fill="#7a6a50">hands empty</text><path d="M284,200 L378,200" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><text x="296" y="222" font-size="13" fill="#7a6a50">raw goods in hand</text><path d="M155,222 L155,296" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/><path d="M282,322 L480,224" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="30" y="410" font-size="14.5" font-style="italic">Between two states the worker walks (A* path) to the next building.</text><text x="30" y="436" font-size="14.5" font-weight="700">Payday (every 120 s): pay taxes, motivation changes – whoever is too unhappy moves away.</text>
</svg>
