<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img"><title>Voice pipeline</title><style>
.bg{fill:#fffaf0;stroke:#e2d6c0}
.t{fill:#3a2d1c;font:15px system-ui,-apple-system,'Segoe UI',sans-serif}
.s{fill:#6b5a43;font:13px system-ui,-apple-system,'Segoe UI',sans-serif}
.h{fill:#3a2d1c;font:600 16px system-ui,-apple-system,'Segoe UI',sans-serif}
.m{fill:#3a2d1c;font:13px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
.box{fill:#fff;stroke:#8a7556;stroke-width:1.5}
.box2{fill:#f3e6cf;stroke:#8a7556;stroke-width:1.5}
.hl{fill:#fde3c4;stroke:#b5651d;stroke-width:1.8}
.blue{fill:#d7e6fb;stroke:#2a78d6;stroke-width:1.5}
.green{fill:#d4efdf;stroke:#2e8b57;stroke-width:1.5}
.red{fill:#f8d7d3;stroke:#c0392b;stroke-width:1.5}
.ln{stroke:#6b5a43;stroke-width:1.6;fill:none}
.lnb{stroke:#2a78d6;stroke-width:2.2;fill:none}
.lnr{stroke:#c0392b;stroke-width:2.2;fill:none}
.lno{stroke:#b5651d;stroke-width:2.2;fill:none}
.lng{stroke:#2e8b57;stroke-width:2.2;fill:none}
.dash{stroke:#8a7556;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.grid{stroke:#e2d6c0;stroke-width:1;fill:none}
.fo{fill:#b5651d}.fb{fill:#2a78d6}.fr{fill:#c0392b}.fg{fill:#2e8b57}.fm{fill:#6b5a43}
.ah{fill:#6b5a43}
</style><rect x="0.5" y="0.5" width="959" height="499" rx="12" class="bg"/>
<text x="30" y="38" class="h" text-anchor="start" >From a role description to a checked recording</text>
<rect x="30" y="70" width="230" height="56" rx="8" class="box2"/>
<text x="145.0" y="94.0" class="t" text-anchor="middle" >describe the role</text>
<text x="145.0" y="114.0" class="s" text-anchor="middle" >age, timbre, attitude</text>
<line x1="260" y1="98" x2="300" y2="98" class="ln"/>
<polygon points="300,98 291.7,101.5 291.7,94.5" class="ah"/>
<rect x="300" y="70" width="230" height="56" rx="8" class="blue"/>
<text x="415.0" y="94.0" class="t" text-anchor="middle" >generate drafts</text>
<text x="415.0" y="114.0" class="s" text-anchor="middle" >Seed Audio</text>
<line x1="530" y1="98" x2="570" y2="98" class="ln"/>
<polygon points="570,98 561.7,101.5 561.7,94.5" class="ah"/>
<rect x="570" y="70" width="230" height="56" rx="8" class="hl"/>
<text x="685.0" y="94.0" class="t" text-anchor="middle" >a human picks a template</text>
<text x="685.0" y="114.0" class="s" text-anchor="middle" >listening page</text>
<line x1="685" y1="126" x2="685" y2="160" class="ln"/>
<polygon points="685,160 681.5,151.7 688.5,151.7" class="ah"/>
<text x="30" y="175" class="s" text-anchor="start" >for every line (DE and EN):</text>
<rect x="570" y="160" width="230" height="50" rx="8" class="blue"/>
<text x="685.0" y="190.0" class="t" text-anchor="middle" >clone from the template</text>
<line x1="570" y1="185" x2="520" y2="185" class="ln"/>
<polygon points="520,185 528.3,181.5 528.3,188.5" class="ah"/>
<rect x="290" y="160" width="230" height="50" rx="8" class="box"/>
<text x="405.0" y="190.0" class="m" text-anchor="middle" >loudnorm −18 LUFS</text>
<line x1="405" y1="210" x2="405" y2="250" class="ln"/>
<polygon points="405,250 401.5,241.7 408.5,241.7" class="ah"/>
<rect x="290" y="250" width="230" height="56" rx="8" class="blue"/>
<text x="405.0" y="274.0" class="t" text-anchor="middle" >second model listens</text>
<text x="405.0" y="294.0" class="s" text-anchor="middle" >Gemini: wording + [NOISE]?</text>
<line x1="405" y1="306" x2="405" y2="340" class="ln"/>
<polygon points="405,340 401.5,331.7 408.5,331.7" class="ah"/>
<polygon points="405,340 525,385 405,430 285,385" class="hl"/>
<text x="405" y="380" class="t" text-anchor="middle" >similarity ≥ 0.85</text>
<text x="405" y="400" class="s" text-anchor="middle" >and no noise?</text>
<line x1="525" y1="385" x2="600" y2="385" class="lng"/>
<polygon points="600,385 591.7,388.5 591.7,381.5" class="ah"/>
<text x="560" y="375" class="s" text-anchor="middle" >yes</text>
<rect x="600" y="360" width="200" height="50" rx="8" class="green"/>
<text x="700.0" y="390.0" class="t" text-anchor="middle" >replace the file</text>
<line x1="285" y1="385" x2="160" y2="385" class="lnr"/>
<polygon points="160,385 168.3,381.5 168.3,388.5" class="ah"/>
<text x="222" y="375" class="s" text-anchor="middle" >no</text>
<rect x="40" y="360" width="120" height="50" rx="8" class="red"/>
<text x="100.0" y="390.0" class="t" text-anchor="middle" >retry, max 6×</text>
<path d="M100,360 L100,232 L830,232 L830,185 L806,185" class="dash"/>
<text x="30" y="470" class="s" text-anchor="start" >A good older recording is only replaced by an attempt that passed.</text>
</svg>
