<text x="626" y="116" class="h" text-anchor="start" >Eine Ecke des Netzes kennt:</text>
<text x="626" y="146" class="m" text-anchor="start" >aBoneIdx = (1, 3, 0, 0)</text>
<text x="626" y="170" class="m" text-anchor="start" >aBoneW   = (0.7, 0.3, 0, 0)</text>
<text x="626" y="194" class="m" text-anchor="start" >aAnim    = (Bild 5, …)</text>
<text x="626" y="232" class="h" text-anchor="start" >Grafikkarte, je Ecke:</text>
<text x="626" y="260" class="m" text-anchor="start" >M = 0.7·Bone(5,1) + 0.3·Bone(5,3)</text>
<text x="626" y="284" class="m" text-anchor="start" >Lage = M · Ruhelage</text>
<text x="626" y="324" class="s" text-anchor="start" >Je Figur schickt die CPU nur</text>
<text x="626" y="344" class="s" text-anchor="start" >Lage, Bildnummer und Farben.</text>
