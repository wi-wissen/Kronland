<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><title>Inhalts-Hash und Cache</title><style>
.bg{fill:#fbf7ef;stroke:#e2d6c0}
.t{fill:#3a2d1c;font:15px system-ui,-apple-system,'Segoe UI',sans-serif}
.s{fill:#6b5a43;font:13px system-ui,-apple-system,'Segoe UI',sans-serif}
.h{fill:#3a2d1c;font:600 16px system-ui,-apple-system,'Segoe UI',sans-serif}
.m{fill:#3a2d1c;font:13px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
.box{fill:#fff;stroke:#8a7556;stroke-width:1.5}
.box2{fill:#f3e6cf;stroke:#8a7556;stroke-width:1.5}
.hl{fill:#fde3c4;stroke:#b5651d;stroke-width:1.8}
.blue{fill:#d7e6fb;stroke:#2a78d6;stroke-width:1.5}
.green{fill:#d4efdf;stroke:#2e8b57;stroke-width:1.5}
.red{fill:#f8d7d3;stroke:#c0392b;stroke-width:1.5}
.ln{stroke:#6b5a43;stroke-width:1.6;fill:none}
.lnb{stroke:#2a78d6;stroke-width:2.2;fill:none}
.lnr{stroke:#c0392b;stroke-width:2.2;fill:none}
.lno{stroke:#b5651d;stroke-width:2.2;fill:none}
.lng{stroke:#2e8b57;stroke-width:2.2;fill:none}
.dash{stroke:#8a7556;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.grid{stroke:#e2d6c0;stroke-width:1;fill:none}
.fo{fill:#b5651d}.fb{fill:#2a78d6}.fr{fill:#c0392b}.fg{fill:#2e8b57}.fm{fill:#6b5a43}
.ah{fill:#6b5a43}
@media (prefers-color-scheme: dark){
.bg{fill:#231c15;stroke:#4a3d2c}
.t,.h,.m{fill:#f1e8d8}.s{fill:#cbbda4}
.box{fill:#2f261c;stroke:#a8936f}
.box2{fill:#3a2f22;stroke:#a8936f}
.hl{fill:#4a3220;stroke:#e08a43}
.blue{fill:#1d2f47;stroke:#5a9be8}
.green{fill:#1d3a2a;stroke:#4cb87c}
.red{fill:#45201c;stroke:#e06a5c}
.ln{stroke:#cbbda4}.ah{fill:#cbbda4}
.lnb{stroke:#5a9be8}.lnr{stroke:#e06a5c}.lno{stroke:#e08a43}.lng{stroke:#4cb87c}
.dash{stroke:#a8936f}.grid{stroke:#3d3226}
.fo{fill:#e08a43}.fb{fill:#5a9be8}.fr{fill:#e06a5c}.fg{fill:#4cb87c}.fm{fill:#cbbda4}
}
</style><rect x="0.5" y="0.5" width="959" height="469" rx="12" class="bg"/>
<text x="30" y="38" class="h" text-anchor="start" >Im Build: Name aus dem Inhalt</text>
<rect x="30" y="60" width="270" height="44" rx="8" class="box2"/>
<text x="165.0" y="87.0" class="m" text-anchor="middle" >models/…/castle.lod1.glb</text>
<line x1="300" y1="82" x2="350" y2="82" class="ln"/>
<polygon points="350,82 341.7,85.5 341.7,78.5" class="ah"/>
<rect x="350" y="60" width="150" height="44" rx="8" class="blue"/>
<text x="425.0" y="87.0" class="m" text-anchor="middle" >SHA-256</text>
<line x1="500" y1="82" x2="550" y2="82" class="ln"/>
<polygon points="550,82 541.7,85.5 541.7,78.5" class="ah"/>
<rect x="550" y="60" width="380" height="44" rx="8" class="hl"/>
<text x="740.0" y="87.0" class="m" text-anchor="middle" >castle.lod1.6792949877.glb</text>
<text x="30" y="134" class="s" text-anchor="start" >Die Zuordnung „logischer Pfad → Datei“ kommt als __KRONLAND_ASSETS__ in den Spielcode; siteUrl() schlägt dort nach.</text>
<text x="30" y="184" class="h" text-anchor="start" >Im Browser: Service-Worker mit CacheFirst</text>
<rect x="30" y="210" width="150" height="50" rx="8" class="box"/>
<text x="105.0" y="231.0" class="t" text-anchor="middle" >Spiel will</text>
<text x="105.0" y="251.0" class="s" text-anchor="middle" >castle.lod1.6792…</text>
<line x1="180" y1="235" x2="230" y2="235" class="ln"/>
<polygon points="230,235 221.7,238.5 221.7,231.5" class="ah"/>
<polygon points="310,200 390,235 310,270 230,235" class="hl"/>
<text x="310" y="240" class="t" text-anchor="middle" >im Cache?</text>
<line x1="390" y1="235" x2="450" y2="235" class="lng"/>
<polygon points="450,235 441.7,238.5 441.7,231.5" class="ah"/>
<text x="420" y="225" class="s" text-anchor="middle" >ja</text>
<rect x="450" y="210" width="230" height="50" rx="8" class="green"/>
<text x="565.0" y="231.0" class="t" text-anchor="middle" >sofort aus dem Cache</text>
<text x="565.0" y="251.0" class="s" text-anchor="middle" >kein Netz, auch offline</text>
<line x1="310" y1="270" x2="310" y2="320" class="lnr"/>
<polygon points="310,320 306.5,311.7 313.5,311.7" class="ah"/>
<text x="322" y="300" class="s" text-anchor="start" >nein</text>
<rect x="220" y="320" width="180" height="50" rx="8" class="blue"/>
<text x="310.0" y="350.0" class="t" text-anchor="middle" >aus dem Netz laden</text>
<line x1="400" y1="345" x2="450" y2="345" class="ln"/>
<polygon points="450,345 441.7,348.5 441.7,341.5" class="ah"/>
<rect x="450" y="320" width="230" height="50" rx="8" class="box2"/>
<text x="565.0" y="350.0" class="t" text-anchor="middle" >im Cache ablegen</text>
<rect x="710" y="200" width="230" height="180" rx="8" class="box"/>
<text x="725" y="226" class="h" text-anchor="start" >Neue Spielversion:</text>
<text x="725" y="252" class="s" text-anchor="start" >geänderte Datei →</text>
<text x="725" y="272" class="s" text-anchor="start" >neuer Name → wird geladen</text>
<text x="725" y="298" class="s" text-anchor="start" >unveränderte Dateien →</text>
<text x="725" y="318" class="s" text-anchor="start" >gleicher Name → Cache</text>
<text x="725" y="346" class="s" text-anchor="start" >alte Namen räumt</text>
<text x="725" y="366" class="s" text-anchor="start" >cacheCleanup.js nach 30 s</text>
<text x="30" y="420" class="s" text-anchor="start" >Ohne Hash wäre CacheFirst gefährlich: Eine geänderte Datei mit altem Namen bliebe für immer veraltet.</text>
</svg>
