<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img"><title>Shrinking animation files</title><style>
.bg{fill:#fffaf0;stroke:#e2d6c0}
.t{fill:#3a2d1c;font:15px system-ui,-apple-system,'Segoe UI',sans-serif}
.s{fill:#6b5a43;font:13px system-ui,-apple-system,'Segoe UI',sans-serif}
.h{fill:#3a2d1c;font:600 16px system-ui,-apple-system,'Segoe UI',sans-serif}
.m{fill:#3a2d1c;font:13px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
.box{fill:#fff;stroke:#8a7556;stroke-width:1.5}
.box2{fill:#f3e6cf;stroke:#8a7556;stroke-width:1.5}
.hl{fill:#fde3c4;stroke:#b5651d;stroke-width:1.8}
.blue{fill:#d7e6fb;stroke:#2a78d6;stroke-width:1.5}
.green{fill:#d4efdf;stroke:#2e8b57;stroke-width:1.5}
.red{fill:#f8d7d3;stroke:#c0392b;stroke-width:1.5}
.ln{stroke:#6b5a43;stroke-width:1.6;fill:none}
.lnb{stroke:#2a78d6;stroke-width:2.2;fill:none}
.lnr{stroke:#c0392b;stroke-width:2.2;fill:none}
.lno{stroke:#b5651d;stroke-width:2.2;fill:none}
.lng{stroke:#2e8b57;stroke-width:2.2;fill:none}
.dash{stroke:#8a7556;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.grid{stroke:#e2d6c0;stroke-width:1;fill:none}
.fo{fill:#b5651d}.fb{fill:#2a78d6}.fr{fill:#c0392b}.fg{fill:#2e8b57}.fm{fill:#6b5a43}
.ah{fill:#6b5a43}
</style><rect x="0.5" y="0.5" width="939" height="329" rx="12" class="bg"/>
<text x="30" y="38" class="h" text-anchor="start" >What Meshy delivers per animation – and what is actually needed</text>
<rect x="40" y="80" width="240" height="56" rx="8" class="box2"/>
<text x="160.0" y="113.0" class="s" text-anchor="middle" >texture 2048²</text>
<rect x="284" y="80" width="80" height="56" rx="8" class="box2"/>
<text x="324.0" y="113.0" class="s" text-anchor="middle" >mesh</text>
<rect x="368" y="80" width="60" height="56" rx="8" class="box2"/>
<text x="398.0" y="113.0" class="s" text-anchor="middle" >Skin</text>
<rect x="432" y="80" width="80" height="56" rx="8" class="box2"/>
<text x="472.0" y="113.0" class="s" text-anchor="middle" >material</text>
<rect x="516" y="80" width="130" height="56" rx="8" class="hl"/>
<text x="581.0" y="113.0" class="s" text-anchor="middle" >anim. tracks</text>
<text x="664" y="114" class="t" text-anchor="start" >4–8 MB per clip</text>
<line x1="260" y1="150" x2="260" y2="196" class="lno"/>
<polygon points="260,196 256.5,187.7 263.5,187.7" class="ah"/>
<text x="272" y="180" class="m" text-anchor="start" >strip-anims.mjs</text>
<rect x="40" y="205" width="70" height="56" rx="8" class="hl"/>
<text x="75.0" y="238.0" class="s" text-anchor="middle" >tracks</text>
<rect x="114" y="205" width="130" height="56" rx="8" class="hl"/>
<text x="179.0" y="238.0" class="s" text-anchor="middle" >bone names</text>
<text x="260" y="239" class="t" text-anchor="start" >20–50 KB per clip</text>
<text x="40" y="300" class="t" text-anchor="start" >All animation files together: 1,470 MB → 16 MB; the finished game model stays bit-identical.</text>
</svg>
