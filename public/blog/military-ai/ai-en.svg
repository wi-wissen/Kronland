<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#3b2a14">
<title>How the AI opponent thinks</title>
<rect width="1100" height="420" fill="#fffaf0"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b7a4a"/></marker></defs><rect x="60" y="40" width="470" height="72" rx="8" fill="#cfe0f2" stroke="#3a6ea5" stroke-width="1.5"/><text x="295" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">1. Assess the situation</text><text x="295" y="81" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">own buildings, serfs, troops, enemies near the</text><text x="295" y="100" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">castle</text><path d="M295,113 L295,130" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="132" width="470" height="72" rx="8" fill="#cfe0f2" stroke="#3a6ea5" stroke-width="1.5"/><text x="295" y="154" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">2. Economy</text><text x="295" y="173" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">buy serfs · research · taxes · build plan ·</text><text x="295" y="192" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">upgrade · assign work</text><path d="M295,205 L295,222" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="224" width="470" height="72" rx="8" fill="#cfe0f2" stroke="#3a6ea5" stroke-width="1.5"/><text x="295" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">3. Military</text><text x="295" y="265" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">recruit · upgrade troops · refill · lead the army ·</text><text x="295" y="284" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">heroes</text><path d="M295,297 L295,314" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="316" width="470" height="72" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="295" y="347.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">4. Commands</text><text x="295" y="366.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">exactly like a human’s</text><path d="M58,352 C10,300 10,80 56,76" fill="none" stroke="#9b7a4a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="295" y="26" text-anchor="middle" font-size="13.5" fill="#7a6a50" font-style="italic">every 12–50 ticks (depending on level)</text><text x="590" y="26" font-size="16" font-weight="700">Army: three states</text><rect x="610" y="70" width="190" height="62" rx="8" fill="#d8ead0" stroke="#4f8a3c" stroke-width="1.5"/><text x="705" y="96.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">gather</text><text x="705" y="115.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">at the rally point</text><rect x="890" y="70" width="210" height="62" rx="8" fill="#f4d5cc" stroke="#b5402a" stroke-width="1.5"/><text x="995" y="96.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">attack</text><text x="995" y="115.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">march on the enemy castle</text><rect x="765" y="290" width="190" height="62" rx="8" fill="#f8e6bf" stroke="#9b7a4a" stroke-width="1.5"/><text x="860" y="316.5" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a14">defend</text><text x="860" y="335.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#7a6a50">enemies near the castle</text><path d="M802,90 L886,90" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><text x="845" y="62" text-anchor="middle" font-size="12.5">enough troops and time is ripe</text><path d="M886,116 L802,116" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><text x="845" y="152" text-anchor="middle" font-size="12.5">strength &lt; 35 % of the start</text><path d="M995,134 L920,288" fill="none" stroke="#b5402a" stroke-width="2" marker-end="url(#ah)"/><path d="M690,134 L800,288" fill="none" stroke="#b5402a" stroke-width="2" marker-end="url(#ah)"/><text x="860" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b5402a">enemy near the castle (priority)</text><path d="M765,330 Q610,300 650,136" fill="none" stroke="#9b7a4a" stroke-width="2" marker-end="url(#ah)"/><text x="600" y="280" font-size="12.5">danger over</text>
</svg>
