<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img"><title>Ereignis in Mission 1</title><style>
.bg{fill:#fffaf0;stroke:#e2d6c0}
.t{fill:#3a2d1c;font:15px system-ui,-apple-system,'Segoe UI',sans-serif}
.s{fill:#6b5a43;font:13px system-ui,-apple-system,'Segoe UI',sans-serif}
.h{fill:#3a2d1c;font:600 16px system-ui,-apple-system,'Segoe UI',sans-serif}
.m{fill:#3a2d1c;font:13px ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
.box{fill:#fff;stroke:#8a7556;stroke-width:1.5}
.box2{fill:#f3e6cf;stroke:#8a7556;stroke-width:1.5}
.hl{fill:#fde3c4;stroke:#b5651d;stroke-width:1.8}
.blue{fill:#d7e6fb;stroke:#2a78d6;stroke-width:1.5}
.green{fill:#d4efdf;stroke:#2e8b57;stroke-width:1.5}
.red{fill:#f8d7d3;stroke:#c0392b;stroke-width:1.5}
.ln{stroke:#6b5a43;stroke-width:1.6;fill:none}
.lnb{stroke:#2a78d6;stroke-width:2.2;fill:none}
.lnr{stroke:#c0392b;stroke-width:2.2;fill:none}
.lno{stroke:#b5651d;stroke-width:2.2;fill:none}
.lng{stroke:#2e8b57;stroke-width:2.2;fill:none}
.dash{stroke:#8a7556;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
.grid{stroke:#e2d6c0;stroke-width:1;fill:none}
.fo{fill:#b5651d}.fb{fill:#2a78d6}.fr{fill:#c0392b}.fg{fill:#2e8b57}.fm{fill:#6b5a43}
.ah{fill:#6b5a43}
</style><rect x="0.5" y="0.5" width="959" height="399" rx="12" class="bg"/>
<text x="30" y="38" class="h" text-anchor="start" >Ereignis „collect“ aus Mission 1: Bedingung (when) → Aktionen (do)</text>
<rect x="40" y="170" width="90" height="40" rx="8" class="blue"/>
<text x="85.0" y="195.0" class="m" text-anchor="middle" >any</text>
<text x="85" y="230" class="s" text-anchor="middle" >eins davon</text>
<rect x="180" y="90" width="170" height="40" rx="8" class="box"/>
<text x="265.0" y="115.0" class="m" text-anchor="middle" >time ≥ 240 s</text>
<rect x="180" y="250" width="90" height="40" rx="8" class="blue"/>
<text x="225.0" y="275.0" class="m" text-anchor="middle" >all</text>
<text x="225" y="310" class="s" text-anchor="middle" >alle</text>
<rect x="310" y="210" width="200" height="40" rx="8" class="box"/>
<text x="410.0" y="235.0" class="s" text-anchor="middle" >Ziel „root“ erfüllt</text>
<rect x="310" y="290" width="200" height="40" rx="8" class="box"/>
<text x="410.0" y="315.0" class="m" text-anchor="middle" >time ≥ 150 s</text>
<line x1="130" y1="190" x2="180" y2="110" class="ln"/>
<line x1="130" y1="190" x2="180" y2="270" class="ln"/>
<line x1="270" y1="270" x2="310" y2="230" class="ln"/>
<line x1="270" y1="270" x2="310" y2="310" class="ln"/>
<line x1="530" y1="190" x2="590" y2="190" class="lno"/>
<polygon points="590,190 581.7,193.5 581.7,186.5" class="ah"/>
<text x="560" y="176" class="m" text-anchor="middle" >do</text>
<rect x="600" y="80" width="90" height="36" rx="8" class="hl"/>
<text x="645.0" y="103.0" class="m" text-anchor="middle" >spawn</text>
<text x="700" y="103" class="s" text-anchor="start" >2 Speerträger-Trupps erscheinen</text>
<rect x="600" y="128" width="90" height="36" rx="8" class="hl"/>
<text x="645.0" y="151.0" class="m" text-anchor="middle" >say</text>
<text x="700" y="151" class="s" text-anchor="start" >Eintreiber spricht</text>
<rect x="600" y="176" width="90" height="36" rx="8" class="hl"/>
<text x="645.0" y="199.0" class="m" text-anchor="middle" >say</text>
<text x="700" y="199" class="s" text-anchor="start" >Orrin antwortet</text>
<rect x="600" y="224" width="90" height="36" rx="8" class="hl"/>
<text x="645.0" y="247.0" class="m" text-anchor="middle" >reveal</text>
<text x="700" y="247" class="s" text-anchor="start" >Trupp aufdecken</text>
<rect x="600" y="272" width="90" height="36" rx="8" class="hl"/>
<text x="645.0" y="295.0" class="m" text-anchor="middle" >reveal</text>
<text x="700" y="295" class="s" text-anchor="start" >Gebiet 30 s aufdecken</text>
<rect x="600" y="320" width="90" height="36" rx="8" class="hl"/>
<text x="645.0" y="343.0" class="m" text-anchor="middle" >camera</text>
<text x="700" y="343" class="s" text-anchor="start" >Kamera schwenkt hin</text>
<text x="40" y="375" class="s" text-anchor="start" >Die Laufzeit prüft die Bedingungen jeden Takt; feuert ein Ereignis, laufen die Aktionen der Reihe nach (Dialoge warten aufeinander).</text>
</svg>
