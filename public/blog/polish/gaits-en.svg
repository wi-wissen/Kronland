<rect x="170" y="248" width="700" height="20" rx="3" class="box"/>
<rect x="170.0" y="250" width="126.0" height="16" rx="2" class="hl"/>
<rect x="520.0" y="250" width="126.0" height="16" rx="2" class="hl"/>
