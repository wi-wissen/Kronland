<circle cx="169.5" cy="199.5" r="6" class="fo"/>
<circle cx="260.0" cy="162.0" r="6" class="fo"/>
<circle cx="350.5" cy="199.5" r="6" class="fo"/>
<circle cx="260" cy="290" r="184.0" class="grid"/>
<circle cx="437.7" cy="337.6" r="6" class="fb"/>
<circle cx="390.1" cy="420.1" r="6" class="fb"/>
<circle cx="307.6" cy="467.7" r="6" class="fb"/>
<circle cx="212.4" cy="467.7" r="6" class="fb"/>
<circle cx="129.9" cy="420.1" r="6" class="fb"/>
<circle cx="82.3" cy="337.6" r="6" class="fb"/>
<circle cx="82.3" cy="242.4" r="6" class="fb"/>
<circle cx="129.9" cy="159.9" r="6" class="fb"/>
