<circle cx="390.1" cy="159.9" r="6" class="fb"/>
<circle cx="437.7" cy="242.4" r="6" class="fb"/>
<circle cx="260" cy="290" r="12" class="fr"/>
<text x="276" y="295" class="h" text-anchor="start" >target</text>
<circle cx="70" cy="90" r="7" class="fg"/>
<line x1="76" y1="96" x2="161.4903320081219" y2="191.49033200812192" class="lng"/>
<polygon points="161.4903320081219,191.49033200812192 153.3,187.7 158.6,183.0" class="ah"/>
<text x="82" y="80" class="s" text-anchor="start" >attacker</text>
<circle cx="520" cy="96" r="6" class="fo"/>
<text x="534" y="101" class="s" text-anchor="start" >inner ring: 8 spots, radius 800</text>
<circle cx="520" cy="122" r="6" class="fb"/>
<text x="534" y="127" class="s" text-anchor="start" >outer ring: 12 spots, radius 1150,</text>
<text x="534" y="145" class="s" text-anchor="start" >offset by 15°</text>
<text x="520" y="200" class="t" text-anchor="start" >1. spot in the direction of approach:</text>
<text x="520" y="224" class="t" text-anchor="start" >   largest dot product direction · offset</text>
<text x="520" y="248" class="t" text-anchor="start" >2. taken? → neighbours alternately</text>
<text x="520" y="272" class="t" text-anchor="start" >   left/right, then the outer ring</text>
<text x="520" y="296" class="t" text-anchor="start" >3. the spot must be walkable</text>
<text x="520" y="320" class="t" text-anchor="start" ></text>
<text x="520" y="344" class="s" text-anchor="start" >Directions from an integer table</text>
<text x="520" y="368" class="s" text-anchor="start" >(sin 15° · 1000 = 259 …): no Math.sin</text>
<text x="520" y="392" class="s" text-anchor="start" >in the simulation, same everywhere.</text>
</svg>
